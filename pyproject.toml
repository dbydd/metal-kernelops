[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-kernelops"
version = "0.3.0"
description = "Metal kernels, aten overlays, and tree-external CV operators for PyTorch on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mps-kernelops contributors"}]
keywords = [
    "mamba",
    "selective-scan",
    "metal",
    "mps",
    "apple-silicon",
    "pytorch",
    "state-space-model",
    "mamba2",
    "vmamba",
    "sparse-attention",
    "operator-fusion",
    "dispatch-key",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
